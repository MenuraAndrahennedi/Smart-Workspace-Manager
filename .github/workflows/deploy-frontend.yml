name: Test and deploy React frontend

on:
  push:
    branches:
      - main
    paths:
      - "frontend/react_app/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-frontend
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/react_app/package-lock.json

      - name: Install dependencies
        working-directory: frontend/react_app
        run: npm ci

      - name: Run lint
        working-directory: frontend/react_app
        run: npm run lint

      - name: Verify production configuration
        shell: bash
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: |
          if [ -z "$VITE_API_BASE_URL" ]; then
            echo "VITE_API_BASE_URL repository variable is missing."
            exit 1
          fi

      - name: Build React application
        working-directory: frontend/react_app
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: frontend/react_app/dist
          output_location: ""
          skip_app_build: true
